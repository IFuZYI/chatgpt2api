services:
  # 一次性容器：把 data/ 属主改成容器内运行用户（uid 65532 / nonroot）。
  # 镜像以 distroless nonroot 运行，而 `./data` 首次创建时属主是 root:root 755，
  # nonroot 写不进去 —— 表现为「/health 200 但一加账号就 permission denied」。
  init-data:
    image: alpine:3.20
    container_name: chatgpt2api-local-init-data
    user: "0:0"
    command:
      - sh
      - -c
      - |
        mkdir -p /data && chown -R 65532:65532 /data
        if [ -f /config/config.json ]; then
          chown 65532:65532 /config/config.json && chmod u+rw /config/config.json
        fi
    volumes:
      - ./data:/data
      # 单文件挂载 config.json 才能 chown 它（否则设置页保存 permission denied）
      - ./config.json:/config/config.json
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    restart: unless-stopped

    # ---- 安全加固 ----
    # 显式声明非 root：镜像默认已是 nonroot（Dockerfile USER nonroot），
    # 但 compose 里写明才能防「有人改了镜像基础层」这类回归。
    user: "65532:65532"
    # 进程不需要任何 capability：单二进制、非 root、不绑特权端口。
    cap_drop:
      - ALL
    # 禁止通过 setuid/setgid 提权。
    security_opt:
      - no-new-privileges:true

    # ---- 日志 ----
    # 不限制的话 docker 默认无限增长，单机跑几个月会写满磁盘
    # （这个服务每 5 分钟刷一次账号，日志量不小）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 关闭预算 ≈ 40s（Shutdown 10s + watcher/cleanup + tasks Close 30s）。
    # Docker 默认 10s 就 SIGKILL，会截断在途任务的落盘。
    stop_grace_period: 45s
    depends_on:
      init-data:
        condition: service_completed_successfully

    # 容器内固定 8080（distroless nonroot 不能绑 <1024）。
    ports:
      - "${CHATGPT2API_PORT:-8000}:8080"

    volumes:
      - ./data:/app/data
      # 用长语法 + create_host_path: false：
      # 短语法在源文件不存在时会**创建一个同名目录**，服务于是读不到配置、
      # 且错误信息是「config 是目录」（config.go 只警告不中断），很难排查。
      # 长语法会直接报错，让人立刻知道要 cp config.example.json config.json。
      - type: bind
        source: ./config.json
        target: /app/config.json
        bind:
          create_host_path: false

    environment:
      # 本地默认用 sqlite（json 后端在账号多时每次全量读写，慢）。
      STORAGE_BACKEND: ${STORAGE_BACKEND:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/accounts.db}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}

      # 调试：置 1 会在 stderr 打 [image] 诊断日志。
      CHATGPT2API_DEBUG: ${CHATGPT2API_DEBUG:-}

    healthcheck:
      test: ["CMD", "/app/chatgpt2api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
