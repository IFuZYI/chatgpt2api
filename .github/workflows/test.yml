name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 时区矩阵是必须的，不是可选优化。
        #
        # 账号侧的时间字段（created_at / last_invalid_at / last_token_refresh_at）
        # 由 nowLocal() 写本地时间、由 parseAccountTime 按本地时区解析。
        # 一旦写入方与解析方的时区约定不一致，只有非 UTC 部署才暴露：
        #   - UTC+X → created_at 看起来已过 X 小时 → 新号宽限永不生效
        #   - UTC-X → created_at 落在未来 → 宽限恒真 → 账号永不可删
        # 实测：撤销 created_at 修复后，UTC 下测试全绿，Asia/Shanghai 与
        # America/Los_Angeles 下才失败。只跑 UTC 等于没测。
        tz: ["UTC", "Asia/Shanghai", "America/Los_Angeles"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal cmd)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi
      # build tag 腐烂是静默的：默认构建不编译带 tag 的文件，
      # 所以 `live` 测试里的 API 一旦变化，普通 CI 完全发现不了 ——
      # 直到有人真的带 tag 去跑。这里只编译不执行（live 测试需要真实
      # 上游凭据，不该在 CI 用真号）。
      - name: compile live-tagged tests
        run: go test -tags live -run '^$' ./internal/upstream/

      - name: test (${{ matrix.tz }})
        run: go test -count=1 ./...


  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: frontend tests
        working-directory: web
        run: npm test
      - name: typecheck
        working-directory: web
        run: npm run typecheck
      - name: build static frontend
        working-directory: web
        run: npm run build
      - name: verify exported artifact
        run: test -s web/out/index.html

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t chatgpt2api:ci .
      - name: Smoke test image
        run: |
          tmp="$(mktemp -d)"
          echo '{"auth-key":"ci-smoke"}' > "$tmp/config.json"
          mkdir -p "$tmp/data"
          docker run -d --name chatgpt2api-ci -p 127.0.0.1:18098:8080 \
            -v "$tmp/config.json:/app/config.json:ro" \
            -v "$tmp/data:/app/data" chatgpt2api:ci
          trap 'docker logs chatgpt2api-ci || true; docker rm -f chatgpt2api-ci || true; rm -rf "$tmp"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18098/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "container health check timed out" >&2
          exit 1

  race:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      # 只跑三个重包：全量 -race 在这三个之外没有并发代码。
      - name: go test -race
        run: go test -race -count=1 ./internal/service/ ./internal/protocol/ ./internal/api/
