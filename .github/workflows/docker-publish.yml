name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also tag the built image as :latest"
        type: boolean
        default: false

env:
  IMAGE_NAME: chatgpt2api
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest 只在「tag 推送」或「手动触发且勾了 push_latest」时打
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.push_latest }}
            type=ref,event=tag
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 必须与 Dockerfile 里 `AS runtime` 一致。
          # 这里曾经写 target: app —— Dockerfile 没有该 stage，
          # CI 在 "load build definition" 之后直接
          # `target stage "app" could not be found`，从未产出过镜像。
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 让构建失败时能看清是哪个阶段挂的
          provenance: true
          sbom: true
