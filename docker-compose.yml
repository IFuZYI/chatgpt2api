services:
  # 一次性容器：把 data/ 的属主改成容器内运行用户（uid 65532 / nonroot）。
  #
  # 为什么需要它：镜像以 distroless nonroot 运行，而 `./data` 由 Docker 在
  # 首次 up 时创建为 root:root 755 —— nonroot 写不进去，服务能启动、
  # /health 也返回 200，但一加账号就报：
  #     [account] save accounts failed: open /app/data/accounts.json.tmp: permission denied
  # 也就是说「看起来健康、实际存不了数据」，极难排查。
  #
  # 手动 chown 也能解决，但要求用户先知道这件事。放在这里自动做掉。
  # 用 alpine 而非 app 镜像：app 是 distroless，没有 chown 命令。
  init-data:
    image: alpine:3.20
    container_name: chatgpt2api-init-data
    user: "0:0"
    # 除了 data/，还要处理 config.json。
    #
    # config.json 是以**单文件 bind mount** 挂进容器的（见 app 的 volumes），
    # 而容器以 uid 65532 运行。宿主的 config.json 通常是 root:root 644，
    # 于是设置页保存会失败：
    #   open /app/config.json: permission denied
    # 且原子写的第一步（创建 .tmp）也会因 /app 目录不可写而失败。
    #
    # 这里把挂进来的 config.json 改成 65532 可写。文件不存在时跳过
    # （用 [ -f ] 判断），不报错。
    command:
      - sh
      - -c
      - |
        mkdir -p /data && chown -R 65532:65532 /data
        if [ -f /config/config.json ]; then
          chown 65532:65532 /config/config.json && chmod u+rw /config/config.json
        fi
    volumes:
      - ./data:/data
      # 单文件挂载 config.json 来 chown —— 实测可行，且会改到宿主文件本身
      # （不需要挂整个项目目录）。
      # 用长语法 + create_host_path: false —— 短语法在源文件不存在时会
      # **创建一个同名目录**，之后 `cp config.example.json config.json`
      # 会把文件拷进那个目录，app 报「config 是目录」并退出。
      - type: bind
        source: ./config.json
        target: /config/config.json
        bind:
          create_host_path: false
    restart: "no"

  app:
    image: ghcr.io/ifuzyi/chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped

    # ---- 安全加固 ----
    # 显式声明非 root：镜像默认已是 nonroot（Dockerfile USER nonroot），
    # 但 compose 里写明才能防「有人改了镜像基础层」这类回归。
    user: "65532:65532"
    # 进程不需要任何 capability：单二进制、非 root、不绑特权端口。
    cap_drop:
      - ALL
    # 禁止通过 setuid/setgid 提权。
    security_opt:
      - no-new-privileges:true

    # ---- 日志 ----
    # 不限制的话 docker 默认无限增长，单机跑几个月会写满磁盘
    # （这个服务每 5 分钟刷一次账号，日志量不小）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 关闭预算 = server.Shutdown(10s) + image tasks Close(30s)
    #            + editable tasks Close(20s) + pending uploads Close(20s)
    #            = 最坏 80s（四个 Close 各有独立 ctx，不共享预算）。
    # Docker 默认只给 10s 就 SIGKILL，会截断「等在途任务写完
    # image_tasks.json / editable_file_tasks.json」和 JSON 后端的原子写。
    # 取 90s：80s 预算 + 10s 余量。
    stop_grace_period: 90s

    depends_on:
      init-data:
        condition: service_completed_successfully

    # 容器内固定监听 8080（distroless nonroot 无法绑 <1024）。
    # 对外端口用 CHATGPT2API_PORT 覆盖，默认 3000。
    ports:
      - "${CHATGPT2API_PORT:-3000}:8080"

    volumes:
      - ./data:/app/data
      # 用长语法 + create_host_path: false：
      # 短语法在源文件不存在时会**创建一个同名目录**，服务于是读不到配置、
      # 且错误信息是「config 是目录」（config.go 只警告不中断），很难排查。
      # 长语法会直接报错，让人立刻知道要 cp config.example.json config.json。
      - type: bind
        source: ./config.json
        target: /app/config.json
        bind:
          create_host_path: false

    environment:
      # ---- 存储后端 ----
      # json | sqlite | postgres | git
      STORAGE_BACKEND: ${STORAGE_BACKEND:-json}

      # sqlite 用本地文件；postgres 用连接串。
      # DATABASE_URL: sqlite:////app/data/accounts.db
      # DATABASE_URL: postgresql://user:password@host:5432/dbname
      DATABASE_URL: ${DATABASE_URL:-}

      # ---- git 后端 ----
      # GIT_REPO_URL: https://github.com/user/repo.git
      # GIT_TOKEN: ghp_xxxxxxxxxxxx
      # GIT_BRANCH: main
      # GIT_FILE_PATH: accounts.json
      GIT_REPO_URL: ${GIT_REPO_URL:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
      GIT_FILE_PATH: ${GIT_FILE_PATH:-}

      # ---- 覆盖 config.json 的项（可选）----
      # 认证密钥：设置后无需在 config.json 里写 auth-key
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      # 对外基础 URL（生成图片链接用）
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      # 监听地址（一般不用改，compose 已映射 8080）
      CHATGPT2API_ADDR: ${CHATGPT2API_ADDR:-:8080}

    healthcheck:
      # distroless 没有 curl/wget，用二进制自带的健康检查子命令。
      test: ["CMD", "/app/chatgpt2api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
