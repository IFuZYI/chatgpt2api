services:
  # 一次性容器：把 data/ 属主改成容器内运行用户（uid 65532 / nonroot）。
  # 镜像以 distroless nonroot 运行，而 `./data` 首次创建时属主是 root:root 755，
  # nonroot 写不进去 —— 表现为「/health 200 但一加账号就 permission denied」。
  init-data:
    image: alpine:3.20
    container_name: chatgpt2api-warp-init-data
    user: "0:0"
    command:
      - sh
      - -c
      - |
        mkdir -p /data && chown -R 65532:65532 /data
        if [ -f /config/config.json ]; then
          chown 65532:65532 /config/config.json && chmod u+rw /config/config.json
        fi
    volumes:
      - ./data:/data
      # 单文件挂载 config.json 才能 chown 它（否则设置页保存 permission denied）
      - ./config.json:/config/config.json
    restart: "no"

  init-config:
    # 用 app 自己的镜像跑 --init-proxy-config 子命令。
    #
    # 这里**不能**依赖任何 Python 运行时：`scripts/init_proxy_config.py` 已随
    # Python 后端一起归档到分支 archive/python-backend-2.0，main 上不再有
    # scripts/ 目录。原来的 `image: python:3.13-alpine` + 挂载 ./scripts
    # 会让这个一次性容器直接失败，整个 WARP 部署路径跑不起来。
    #
    # 复用同一镜像还有个好处：配置合并逻辑与主程序同源，不会出现
    # 「init 写进去的字段主程序不认」这类漂移。
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:warp
    container_name: chatgpt2api-warp-init
    # 必须以 root 运行。
    #
    # 镜像本身是 distroless nonroot（uid 65532），而 config.json 由操作者在
    # 宿主机上创建（通常属主 root、模式 644）—— nonroot 写不进去，实测报
    # `open /app/host/config.json: permission denied`，整个 WARP 部署卡在第一步。
    #
    # 这个容器只做一件事：把 proxy_runtime 默认值合并进配置文件后退出，
    # 不监听端口、不处理网络请求，所以用 root 的暴露面很小。
    user: "0:0"
    # init-config 负责**创建/合并** config.json（会写文件），
    # 所以不能要求文件已存在 —— 挂项目根目录，只碰 config.json。
    # 注意：app 服务那条用长语法 + create_host_path:false，要求文件存在 ——
    # 顺序由 depends_on(service_completed_successfully) 保证。
    volumes:
      - ./:/app/host
    working_dir: /app
    environment:
      CHATGPT2API_CONFIG_FILE: /app/host/config.json
      CHATGPT2API_PROXY_RUNTIME_ENABLED: ${CHATGPT2API_PROXY_RUNTIME_ENABLED:-true}
      CHATGPT2API_PROXY_RUNTIME_EGRESS_MODE: ${CHATGPT2API_PROXY_RUNTIME_EGRESS_MODE:-single_proxy}
      CHATGPT2API_PROXY_RUNTIME_PROXY_URL: ${CHATGPT2API_PROXY_RUNTIME_PROXY_URL:-http://privoxy:8118}
      CHATGPT2API_PROXY_RUNTIME_RESOURCE_PROXY_URL: ${CHATGPT2API_PROXY_RUNTIME_RESOURCE_PROXY_URL:-}
      CHATGPT2API_PROXY_RUNTIME_SKIP_SSL_VERIFY: ${CHATGPT2API_PROXY_RUNTIME_SKIP_SSL_VERIFY:-false}
      CHATGPT2API_PROXY_RUNTIME_RESET_STATUS_CODES: ${CHATGPT2API_PROXY_RUNTIME_RESET_STATUS_CODES:-403}
      CHATGPT2API_PROXY_RUNTIME_CLEARANCE_ENABLED: ${CHATGPT2API_PROXY_RUNTIME_CLEARANCE_ENABLED:-true}
      CHATGPT2API_PROXY_RUNTIME_CLEARANCE_MODE: ${CHATGPT2API_PROXY_RUNTIME_CLEARANCE_MODE:-flaresolverr}
      CHATGPT2API_PROXY_RUNTIME_CLEARANCE_TIMEOUT_SEC: ${CHATGPT2API_PROXY_RUNTIME_CLEARANCE_TIMEOUT_SEC:-60}
      CHATGPT2API_PROXY_RUNTIME_CLEARANCE_REFRESH_INTERVAL: ${CHATGPT2API_PROXY_RUNTIME_CLEARANCE_REFRESH_INTERVAL:-3600}
      CHATGPT2API_PROXY_RUNTIME_WARM_UP_ON_START: ${CHATGPT2API_PROXY_RUNTIME_WARM_UP_ON_START:-false}
      CHATGPT2API_PROXY_RUNTIME_BROWSER: ${CHATGPT2API_PROXY_RUNTIME_BROWSER:-chrome}
      CHATGPT2API_PROXY_RUNTIME_USER_AGENT: ${CHATGPT2API_PROXY_RUNTIME_USER_AGENT:-}
      CHATGPT2API_FLARESOLVERR_URL: ${CHATGPT2API_FLARESOLVERR_URL:-http://flaresolverr:8191}
    # 只写 flag —— 镜像的 ENTRYPOINT 已经是 /app/chatgpt2api，
    # command 会被**追加**在它后面。若在这里再写一遍二进制路径，
    # 实际执行变成 `/app/chatgpt2api /app/chatgpt2api --init-proxy-config`，
    # flag.Parse 遇到位置参数就停止解析，子命令不生效，直接掉进正常启动流程
    # 并报 "auth-key 未设置"（实测踩到）。
    command: ["--init-proxy-config"]
    restart: "no"

  warp-proxy:
    image: caomingjun/warp:latest
    container_name: chatgpt2api-warp-proxy
    restart: unless-stopped

    # ---- 安全加固 ----
    # 显式声明非 root：镜像默认已是 nonroot（Dockerfile USER nonroot），
    # 但 compose 里写明才能防「有人改了镜像基础层」这类回归。
    user: "65532:65532"
    # 进程不需要任何 capability：单二进制、非 root、不绑特权端口。
    cap_drop:
      - ALL
    # 禁止通过 setuid/setgid 提权。
    security_opt:
      - no-new-privileges:true

    # ---- 日志 ----
    # 不限制的话 docker 默认无限增长，单机跑几个月会写满磁盘
    # （这个服务每 5 分钟刷一次账号，日志量不小）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      WARP_SLEEP: "2"
      # 可选：填写 Cloudflare WARP+ License Key
      # WARP_LICENSE_KEY: ${WARP_LICENSE_KEY:-}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    ports:
      - "127.0.0.1:${WARP_SOCKS_PORT:-40000}:1080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('127.0.0.1', 1080), 5); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  privoxy:
    image: vimagick/privoxy:latest
    container_name: chatgpt2api-privoxy
    restart: unless-stopped
    depends_on:
      warp-proxy:
        condition: service_started
    volumes:
      - ./scripts/privoxy-warp.conf:/etc/privoxy/config:ro
    ports:
      - "127.0.0.1:${PRIVOXY_PORT:-40080}:8118"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8118 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: chatgpt2api-flaresolverr
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${FLARESOLVERR_PORT:-8191}:8191"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:warp
    container_name: chatgpt2api-warp
    restart: unless-stopped

    # ---- 安全加固 ----
    # 显式声明非 root：镜像默认已是 nonroot（Dockerfile USER nonroot），
    # 但 compose 里写明才能防「有人改了镜像基础层」这类回归。
    user: "65532:65532"
    # 进程不需要任何 capability：单二进制、非 root、不绑特权端口。
    cap_drop:
      - ALL
    # 禁止通过 setuid/setgid 提权。
    security_opt:
      - no-new-privileges:true

    # ---- 日志 ----
    # 不限制的话 docker 默认无限增长，单机跑几个月会写满磁盘。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 关闭预算 = server.Shutdown(10s) + image tasks Close(30s) = 40s。
    # Docker 默认只给 10s 就 SIGKILL，会让「等在途任务写完 image_tasks.json」被截断。
    stop_grace_period: 45s
    depends_on:
      init-data:
        condition: service_completed_successfully
      init-config:
        condition: service_completed_successfully
      privoxy:
        condition: service_started
      flaresolverr:
        condition: service_started
    # 容器内固定 8080（distroless nonroot 不能绑 <1024）。
    ports:
      - "${CHATGPT2API_PORT:-3000}:8080"
    volumes:
      - ./data:/app/data
      # 长语法 + create_host_path: false：源文件不存在时直接报错，
      # 而不是悄悄创建一个同名目录（服务会读不到配置且提示难懂）。
      - type: bind
        source: ./config.json
        target: /app/config.json
        bind:
          create_host_path: false
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}

    healthcheck:
      # distroless 没有 curl/wget，用二进制自带的探针。
      test: ["CMD", "/app/chatgpt2api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
